[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-mentor-vn"
version = "1.0.0"
description = "CLI Coding Assistant & Autonomous Auto-Debugger bằng Tiếng Việt ứng dụng OpenAI API"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Ứng viên OpenAI Codex Ambassador"}]
dependencies = [
    "openai>=1.50.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
codex-mentor = "codex_mentor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
